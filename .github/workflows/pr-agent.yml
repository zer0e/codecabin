# PR-Agent 自动审查：PR 开启/更新时自动 describe + review + improve。
# 经 LiteLLM 支持 OpenAI 兼容与 Anthropic 兼容两种端点，配置经仓库 Secrets/Variables 注入：
#   Secret:   OPENAI_KEY            — API 密钥（两种协议共用）
#   Variable: OPENAI_API_BASE       — 端点地址（OpenAI 兼容如 https://api.example.com/v1；
#                                     Anthropic 兼容如 https://…/apps/anthropic）
#   Variable: PR_REVIEW_MODEL       — 模型 ID，可带协议前缀 openai/<model> 或 anthropic/<model>；
#                                     不带前缀时按端点 URL 自动推断协议
#   Variable: PR_REVIEW_MAX_TOKENS  — 可选，模型上下文上限（默认 32000）
name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# 同一 PR 连续推送只保留最新审查，取消过期运行（避免重复评论与额度浪费）
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    # fork PR 拿不到仓库 secrets，跳过而非红叉（审查仅覆盖同仓库分支 PR）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      # LiteLLM 要求模型带协议前缀。显式前缀（openai/ 或 anthropic/）优先；
      # 无前缀时按端点 URL 推断：含 anthropic → Anthropic 协议，否则 OpenAI 兼容
      REVIEW_MODEL: ${{ startsWith(vars.PR_REVIEW_MODEL, 'openai/') && vars.PR_REVIEW_MODEL || startsWith(vars.PR_REVIEW_MODEL, 'anthropic/') && vars.PR_REVIEW_MODEL || (contains(vars.OPENAI_API_BASE, 'anthropic') && format('anthropic/{0}', vars.PR_REVIEW_MODEL) || format('openai/{0}', vars.PR_REVIEW_MODEL)) }}
    steps:
      - name: Validate review configuration
        env:
          REVIEW_MODEL_VAR: ${{ vars.PR_REVIEW_MODEL }}
          API_BASE_VAR: ${{ vars.OPENAI_API_BASE }}
          API_KEY_VAR: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$REVIEW_MODEL_VAR" ] || [ -z "$API_BASE_VAR" ] || [ -z "$API_KEY_VAR" ]; then
            echo "::error::仓库配置缺失：需要 Secret OPENAI_KEY 与 Variables OPENAI_API_BASE / PR_REVIEW_MODEL（Settings → Secrets and variables → Actions）" >&2
            exit 1
          fi
      - name: PR-Agent review
        # 官方 SECURITY.md 推荐的双重钉定：直接用 digest 钉定的 v0.50.0 运行时镜像，
        # 不经滚动 tag 的 wrapper action（The-PR-Agent/pr-agent，原 qodo-ai/pr-agent）
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ vars.OPENAI_API_BASE }}
          # Anthropic 兼容端点走这组（LiteLLM 调 {base}/v1/messages）
          ANTHROPIC__KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_API_BASE: ${{ vars.OPENAI_API_BASE }}
          CONFIG__MODEL: ${{ env.REVIEW_MODEL }}
          # fallback 与主模型一致，避免回退到端点不存在的默认模型（如 gpt-6-luna）
          CONFIG__FALLBACK_MODELS: ${{ format('["{0}"]', env.REVIEW_MODEL) }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ vars.PR_REVIEW_MAX_TOKENS || '32000' }}
          # 仓库 .pr_agent.toml 从 base 分支（main）读取，PR 合并前不生效；
          # 经 env 直接注入，保证 synchronize（推送修复）立即触发自动重审
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
